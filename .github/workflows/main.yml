name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            m4 \
            gettext \
            pkg-config \
            libffi-dev \
            libssl-dev

      - name: Fix Autoconf Libtool macros
        run: |
          echo "Checking Libtool..."

          libtoolize --version
          autoreconf --version
          aclocal --version

          LIBTOOL_M4=$(find /usr -name "libtool.m4" 2>/dev/null | head -n 1)

          if [ -z "$LIBTOOL_M4" ]; then
            echo "ERROR: libtool.m4 not found"
            exit 1
          fi

          echo "Found libtool.m4:"
          echo "$LIBTOOL_M4"

          LIBTOOL_ACLOCAL=$(dirname "$LIBTOOL_M4")

          echo "ACLOCAL_PATH=$LIBTOOL_ACLOCAL" >> "$GITHUB_ENV"
          export ACLOCAL_PATH="$LIBTOOL_ACLOCAL"

          echo "ACLOCAL_PATH=$ACLOCAL_PATH"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython<3"

      - name: Configure Buildozer Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf \
            "$HOME/.buildozer/android/platform/android-sdk"

          ln -s \
            "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

      - name: Fix old sdkmanager path
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -path "*/bin/sdkmanager" \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          mkdir -p \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin"

          ln -sf \
            "$SDKMANAGER" \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          command -v sdkmanager
          sdkmanager --version

          command -v adb
          adb version

          echo "SDK check completed successfully."

      - name: Clean old Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
          ACLOCAL_PATH: ${{ env.ACLOCAL_PATH }}
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
          if-no-files-found: error
