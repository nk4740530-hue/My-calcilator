name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            m4 \
            gettext \
            pkg-config \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake

      - name: Check Python
        run: |
          python --version
          python -c "import sys; print(sys.version)"
          which python

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          adb version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer==1.5.0"

          python -m pip install \
            "cython==0.29.36"

      - name: Check Buildozer
        run: |
          buildozer --version
          cython --version

      - name: Configure Buildozer Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf \
            "$HOME/.buildozer/android/platform/android-sdk"

          ln -s \
            "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

      - name: Fix old sdkmanager path
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -path "*/bin/sdkmanager" \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "sdkmanager found at:"
          echo "$SDKMANAGER"

          mkdir -p \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin"

          ln -sf \
            "$SDKMANAGER" \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"

      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Verify build configuration
        run: |
          echo "================================"
          echo "Python:"
          python --version

          echo "================================"
          echo "Buildozer:"
          buildozer --version

          echo "================================"
          echo "Cython:"
          cython --version

          echo "================================"
          echo "Android SDK:"
          echo "$ANDROID_HOME"

      - name: Build APK
        run: |
          echo "================================"
          echo "STARTING APK BUILD"
          echo "================================"

          buildozer android clean

          buildozer android debug

      - name: Check APK
        run: |
          echo "================================"
          echo "APK FILES:"
          echo "================================"

          ls -lah bin/

          APK_COUNT=$(find bin -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
          if-no-files-found: error
