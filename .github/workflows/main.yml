name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Check Python
        run: |
          python --version
          python -c "import sys; print(sys.version)"
          which python

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            m4 \
            gettext \
            pkg-config \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake

      - name: Check Java
        run: |
          java -version
          javac -version

      - name: Fix Autoconf Libtool macros
        run: |
          echo "Checking Autoconf and Libtool..."

          libtoolize --version
          autoconf --version
          automake --version
          aclocal --version

          LIBTOOL_M4=$(find /usr/share -name "libtool.m4" 2>/dev/null | head -n 1)

          if [ -z "$LIBTOOL_M4" ]; then
            echo "ERROR: libtool.m4 not found"
            exit 1
          fi

          echo "Found libtool.m4:"
          echo "$LIBTOOL_M4"

          LIBTOOL_M4_DIR=$(dirname "$LIBTOOL_M4")

          mkdir -p "$HOME/.local/share/aclocal"

          cp "$LIBTOOL_M4" \
            "$HOME/.local/share/aclocal/libtool.m4"

          echo "ACLOCAL_PATH=$HOME/.local/share/aclocal:/usr/share/aclocal" >> "$GITHUB_ENV"

          echo "Libtool macro installed successfully."

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          command -v sdkmanager
          sdkmanager --version

          command -v adb
          adb version

          echo "SDK check completed successfully."

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer==1.5.0"

          python -m pip install \
            "cython==0.29.36"

      - name: Check Buildozer and Cython
        run: |
          echo "Buildozer:"
          buildozer --version

          echo "Cython:"
          cython --version

          echo "Python:"
          python --version

      - name: Configure Buildozer Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf \
            "$HOME/.buildozer/android/platform/android-sdk"

          ln -s \
            "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

      - name: Fix old sdkmanager path
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -path "*/bin/sdkmanager" \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          mkdir -p \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin"

          ln -sf \
            "$SDKMANAGER" \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"

      - name: Clean old Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Prepare Autoconf environment
        run: |
          export ACLOCAL_PATH="$HOME/.local/share/aclocal:/usr/share/aclocal"

          echo "ACLOCAL_PATH=$ACLOCAL_PATH" >> "$GITHUB_ENV"

          aclocal --print-ac-dir

          echo "Autoconf environment prepared."

      - name: Verify Build Configuration
        run: |
          echo "================================"
          echo "PYTHON"
          echo "================================"
          python --version

          echo "================================"
          echo "CYTHON"
          echo "================================"
          cython --version

          echo "================================"
          echo "BUILDOZER"
          echo "================================"
          buildozer --version

          echo "================================"
          echo "ANDROID SDK"
          echo "================================"
          echo "$ANDROID_HOME"

      - name: Build APK
        env:
          ACLOCAL_PATH: ${{ env.ACLOCAL_PATH }}
        run: |
          echo "================================"
          echo "STARTING APK BUILD"
          echo "================================"

          export ACLOCAL_PATH="$HOME/.local/share/aclocal:/usr/share/aclocal"

          buildozer android debug

      - name: Check APK
        run: |
          echo "================================"
          echo "APK FILES"
          echo "================================"

          ls -lah bin/

          APK_COUNT=$(find bin -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
          if-no-files-found: error
